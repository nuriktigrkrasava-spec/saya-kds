# Render Blueprint for "Saya KDS"
# Один web-сервис отдаёт FastAPI API + собранный React SPA (frontend/dist),
# плюс управляемая база данных PostgreSQL.
#
# Документация по применению (по-русски, для не-программиста): см. DEPLOY.md
#
# ВАЖНО про DATABASE_URL:
#   Render для своей базы выдаёт строку вида postgres://...
#   Этому приложению (async SQLAlchemy) нужна форма postgresql+asyncpg://...
#   Поэтому DATABASE_URL здесь помечен sync: false — его нужно вставить вручную
#   в дашборде Render, заменив схему postgres:// на postgresql+asyncpg://
#   (строку берём из вкладки базы saya-kds-db -> Internal Database URL).
#   Подробности — в DEPLOY.md, раздел про базу данных.

services:
  - type: web
    name: saya-kds
    runtime: python
    plan: starter            # платный план: free-инстанс засыпает и теряет соединения
    branch: phase1-backend-ingest
    healthCheckPath: /health
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && pip install -e .
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # --- Секреты: заполняются вручную в дашборде Render (sync: false) ---
      - key: CLOUD_API_LOGIN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: RMS_BASE
        sync: false
      - key: RMS_LOGIN
        sync: false
      - key: RMS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Ключ для выгрузки аналитики во внешний сервис (/admin/analytics/export).
      # Придумай длинную строку и вставь её и здесь (в дашборде), и в своём сервисе.
      - key: ANALYTICS_API_KEY
        sync: false
      # Код филиала в RMS (Гейдар Алиева). Нужен входу курьеров по явке
      # (/tg/shift-employees) и фильтру курьеров на дашборде.
      - key: BRANCH_CODE
        value: "10ASTKBN"
      # Фоллбэк-поллер доставки: добирает из iiko обновления, потерянные
      # вебхуками, — без него заказы висят на планшете незакрытыми (31.07.2026).
      # Первый проход после старта догоняет POLL_CATCHUP_DAYS суток, дальше идёт
      # инкрементально по ревизиям. 0 = выключен.
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: POLL_ORG_IDS
        value: "d9a4272f-65f0-4e56-8846-434f2348889c"
      - key: POLL_CATCHUP_DAYS
        value: "2"
      # Поллер зала: тянет dine-in заказы из Cloud (order/by_table) раз в N сек.
      # iiko починили выгрузку зала у Алиева 06.07.2026. 0 = выключен.
      - key: HALL_POLL_INTERVAL_SECONDS
        value: "15"
      - key: HALL_POLL_ORG_IDS
        value: "d9a4272f-65f0-4e56-8846-434f2348889c"
      # --- База данных ---
      # Вставляется вручную в форме postgresql+asyncpg://... (см. DEPLOY.md).
      # Render-овская fromDatabase даёт схему postgres://, которая НЕ подходит
      # для async SQLAlchemy, поэтому используем sync: false.
      - key: DATABASE_URL
        sync: false

databases:
  - name: saya-kds-db
    plan: basic-256mb        # минимальный платный план; free-база живёт ограниченно
    databaseName: saya_kds
    user: saya_kds

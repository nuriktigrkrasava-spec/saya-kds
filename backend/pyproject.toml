[project]
name = "saya-kds-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "python-socketio==5.17.0",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.1.4",
    "aiosqlite==0.22.1",
    "asyncpg==0.32.0",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "respx==0.23.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["requires_real_auth: test the real server authorization"]
